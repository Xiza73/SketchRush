<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SketchRush</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1C1A17" />
    <meta
      name="description"
      content="Draw and guess, up to 10 players, in Spanish and English. You pick your word out of three and draw against the clock; the drawer is paid the room's average, so a turn nobody guesses is worth zero."
    />
    <!--
      The card is built by `node scripts/build-og.mjs [domain]`, which prints
      the three lines below with whatever domain it stamped on the image. They
      have to name the host this is actually served from: a card served from one
      host and advertised from another is a broken preview, and the absolute URL
      is not optional — scrapers do not resolve a relative one.

      og-es.png exists too. Which one a scraper should get depends on the reader,
      and Open Graph has no way to say that from a static page, so the English
      card is the one advertised.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SketchRush" />
    <meta property="og:url" content="https://sketchrush.up.railway.app/" />
    <meta property="og:title" content="SketchRush · Draw and guess" />
    <meta
      property="og:description"
      content="Draw it. Make it obvious. Rooms of up to 10 players, in Spanish and English."
    />
    <meta property="og:image" content="https://sketchrush.up.railway.app/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SketchRush: draw it, make it obvious." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SketchRush · Draw and guess" />
    <meta
      name="twitter:description"
      content="Draw it. Make it obvious. Rooms of up to 10 players, in Spanish and English."
    />
    <meta name="twitter:image" content="https://sketchrush.up.railway.app/og-en.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <script>
      // Apply the stored theme before React mounts to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('dle.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
